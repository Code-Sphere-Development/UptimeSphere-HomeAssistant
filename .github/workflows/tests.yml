name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. pytest-homeassistant-custom-component
        # pins the Home Assistant version it tests against and drops older
        # interpreters as Home Assistant does, so the requirement in
        # requirements_test.txt resolves differently per interpreter: 3.13 gets
        # the last release that still supports it, 3.14 gets the current one.
        # Testing both means neither the oldest supported Home Assistant nor the
        # one people actually run goes unverified.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The requirement is a floor, so which Home Assistant this leg actually
      # exercises is decided by pip, not by the repository. Print it.
      - name: Show what is being tested against
        run: python -c "from importlib.metadata import version; print('homeassistant', version('homeassistant'))"

      - name: Test
        run: pytest --cov=custom_components/uptimesphere --cov-report=term-missing
